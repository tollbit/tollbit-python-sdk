openapi: 3.0.0
info:
  title: TollBit Services
  version: 0.0.0
tags:
  - name: Auth Tokens
  - name: Tollbit Content
  - name: Get Tollbit Content
  - name: Get Tollbit Rates
  - name: Get Catalog of Pages for Property
  - name: Search
  - name: Search Content
paths:
  /dev/v2/content/{contentUrl}:
    get:
      operationId: ContentService_getContent
      parameters:
        - name: contentUrl
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContentResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
      tags:
        - Tollbit Content
        - Get Tollbit Content
      security:
        - ApiKeyAuth_: []
  /dev/v2/content/{propertyDomain}/catalog/list:
    get:
      operationId: ContentService_getCatalog
      parameters:
        - name: propertyDomain
          in: path
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: pageToken
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
      tags:
        - Tollbit Content
        - Get Catalog of Pages for Property
      security:
        - ApiKeyAuth: []
  /dev/v2/rates/{contentUrl}:
    get:
      operationId: ContentService_getRates
      parameters:
        - name: contentUrl
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeveloperRateResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
      tags:
        - Tollbit Content
        - Get Tollbit Rates
      security:
        - ApiKeyAuth: []
  /dev/v2/search:
    get:
      operationId: SearchService_search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: size
          in: query
          required: false
          description: Number of results to return. Maximum value is 20.
          schema:
            type: integer
            format: int32
          explode: false
        - name: next-token
          in: query
          required: false
          description: Token for pagination. If provided, continues from the encoded page. If not provided, returns first page.
          schema:
            type: string
          explode: false
        - name: properties
          in: query
          required: false
          description: Comma-separated list of domains (max 20) to boost in search results. When provided, generates a custom goggle string.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSearchResultResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
      tags:
        - Search
        - Search Content
      security:
        - ApiKeyAuth: []
  /tollbit/dev/v2/tokens/aos:
    post:
      operationId: TokensService_createAOSAccessToken
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAOSAccessTokenResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
      tags:
        - Auth Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAOSAccessTokenRequest'
      security:
        - ApiKeyAuth: []
  /tollbit/dev/v2/tokens/content:
    post:
      operationId: TokensService_createContentAccessToken
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSubdomainAccessTokenResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
      tags:
        - Auth Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubdomainAccessTokenRequest'
      security:
        - ApiKeyAuth: []
  /tollbit/dev/v2/tokens/crawl:
    post:
      operationId: TokensService_createCrawlAccessToken
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCrawlAccessTokenResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJSON'
      tags:
        - Auth Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCrawlAccessTokenRequest'
      security:
        - ApiKeyAuth: []
components:
  schemas:
    Availability:
      type: object
      required:
        - discoverable
        - ready_to_license
      properties:
        discoverable:
          type: boolean
        ready_to_license:
          type: boolean
    CatalogResponse:
      type: object
      required:
        - pages
      properties:
        pageToken:
          type: string
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PropertyPage'
    ContentMetadata:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        author:
          type: string
        published:
          type: string
        modified:
          type: string
    ContentRate:
      type: object
      required:
        - price
        - license
      properties:
        price:
          $ref: '#/components/schemas/RatePrice'
        license:
          $ref: '#/components/schemas/RateLicenseResponse'
    CreateAOSAccessTokenRequest:
      type: object
      required:
        - url
        - userAgent
      properties:
        url:
          type: string
          format: uri
        userAgent:
          type: string
    CreateAOSAccessTokenResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    CreateCrawlAccessTokenRequest:
      type: object
      required:
        - url
        - userAgent
      properties:
        url:
          type: string
          format: uri
        userAgent:
          type: string
    CreateCrawlAccessTokenResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    CreateSubdomainAccessTokenRequest:
      type: object
      required:
        - url
        - userAgent
        - maxPriceMicros
        - currency
        - licenseType
        - licenseCuid
      properties:
        url:
          type: string
          format: uri
        userAgent:
          type: string
        maxPriceMicros:
          type: integer
          format: int64
        currency:
          type: string
        licenseType:
          type: string
        licenseCuid:
          type: string
        format:
          type: string
          enum:
            - html
            - markdown
    CreateSubdomainAccessTokenResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    DeveloperRateResponse:
      type: object
      required:
        - price
        - license
      properties:
        price:
          $ref: '#/components/schemas/RatePrice'
        license:
          $ref: '#/components/schemas/RateLicenseResponse'
    Error:
      type: object
    GetContentResponse:
      type: object
      required:
        - content
        - metadata
      properties:
        content:
          $ref: '#/components/schemas/PageContent'
        metadata:
          $ref: '#/components/schemas/ContentMetadata'
        rate:
          $ref: '#/components/schemas/ContentRate'
    PageContent:
      type: object
      required:
        - header
        - body
        - footer
      properties:
        header:
          type: string
        body:
          type: string
        footer:
          type: string
    PagedSearchResultResponse:
      type: object
      allOf:
        - type: object
          required:
            - nextToken
            - items
          properties:
            nextToken:
              type: string
            items:
              type: array
              items:
                $ref: '#/components/schemas/SearchResult'
    ProblemJSON:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
      additionalProperties: {}
    PropertyPage:
      type: object
      required:
        - propertyId
        - pageUrl
      properties:
        propertyId:
          type: string
        pageUrl:
          type: string
        lastMod:
          type: string
          format: date-time
    Publisher:
      type: object
      required:
        - domain
        - name
      properties:
        domain:
          type: string
        name:
          type: string
    RateLicensePermission:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    RateLicenseResponse:
      type: object
      required:
        - id
        - licenseType
        - licensePath
        - permissions
      properties:
        id:
          type: string
        licenseType:
          type: string
        licensePath:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/RateLicensePermission'
    RatePrice:
      type: object
      required:
        - priceMicros
        - currency
      properties:
        priceMicros:
          type: integer
          format: int64
        currency:
          type: string
    SearchResult:
      type: object
      required:
        - title
        - url
        - published_date
        - publisher
        - availability
      properties:
        title:
          type: string
        url:
          type: string
        published_date:
          type: string
        publisher:
          $ref: '#/components/schemas/Publisher'
        availability:
          $ref: '#/components/schemas/Availability'
    SubdomainAccessToken:
      type: object
      required:
        - type
        - scheme
      properties:
        type:
          type: string
          enum:
            - http
        scheme:
          type: string
          enum:
            - Bearer
      description: |-
        To access content on a TollBit subdomain, you will need an access token. This token is a JWT that is signed by TollBit and includes information about the subdomain and the permissions granted to the token.

        You can obtain the token by calling the TokensService to create a Content Access Token. Once you have the token, you can include it in the Authorization header of your requests to the subdomain.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: TollbitKey
    ApiKeyAuth_:
      type: apiKey
      in: header
      name: Tollbit-Token
servers:
  - url: https://gateway.tollbit.com
    variables: {}
